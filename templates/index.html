<!DOCTYPE html>
<html>
<head>
<title>BMI Calculator</title>

<style>

body{
    text-align:center;
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

/* Banner Image */
.banner{
    width:100%;
    height:300px;
    object-fit:cover;
}

h2{
    margin-top:20px;
}

form{
    background:white;
    width:300px;
    margin:30px auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 4px 10px rgba(0,0,0,0.2);
}

input{
    width:80%;
    padding:8px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    padding:10px 20px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#006400;
}

</style>

</head>

<body>

<img class="banner" src="https://media.gettyimages.com/id/884065940/photo/flexing-muscles.jpg?s=612x612&w=0&k=20&c=voDZyyasX58yd8A3Y13AfRs-MnVsXBSKeFjV-LngrCA=">

<h2>BMI Calculator</h2>

<form method="POST">

Height (cm)<br>
<input type="number" name="height" required><br><br>

Weight (kg)<br>
<input type="number" name="weight" required><br><br>

<button type="submit">Calculate BMI</button>

</form>

{% if bmi %}
<h3>Your BMI: {{ bmi }}</h3>
{% endif %}

</body>
</html>
